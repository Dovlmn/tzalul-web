<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>צלול</title>
<meta name="theme-color" content="#4886D8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="צלול">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap">
<style>
/* Layout: white list rail on the right, a solid blue working canvas with white task cards; the rail becomes a drawer on phones */
:root{
  --canvas-base:#4886D8; --canvas:var(--canvas-base); --canvas-ink:#FFFFFF; --canvas-soft:rgba(255,255,255,.18); --canvas-softer:rgba(255,255,255,.10); --canvas-muted:rgba(255,255,255,.82);
  --rail:#FFFFFF; --rail-hi:#EFEFEF; --rail-line:#E4E4E4;
  --card:#FFFFFF; --row-line:#ECECEC; --row-hover:#F6F7F8; --field:#FFFFFF; --field-line:#DADDE1;
  --ink:#24272B; --muted:#7A8088; --faint:#ADB2B8;
  --accent:#2563B6; --on-accent:#FFFFFF; --accent-soft:#E6EFFB;
  --star:#F5C518; --star-off:#D3D6DA;
  --c-inbox:#8F959C; --c-next:#5B8DEF; --c-later:#9483CF; --c-sched:#4CAF83; --c-someday:#E0708A; --c-waiting:#D69A3A; --c-ref:#8F959C;
  --danger:#D2483F; --ok:#4CAF50; --dot-ok:#A6E35C; --dot-warn:#FFCF4A;
  --shadow:0 1px 2px rgba(20,40,70,.12),0 10px 30px rgba(20,40,70,.18);
  --f:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
:root[data-canvas-light]{--canvas-ink:#24272B; --canvas-soft:rgba(0,0,0,.09); --canvas-softer:rgba(0,0,0,.05); --canvas-muted:rgba(0,0,0,.6)}
:root[data-canvas-light] ul.tasks,:root[data-canvas-light] .projcard,:root[data-canvas-light] .addbar,:root[data-canvas-light] .refhead{box-shadow:0 0 0 1px rgba(0,0,0,.09)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:color-mix(in srgb, var(--canvas-base) 45%, #0B1422); --canvas-ink:#FFFFFF; --canvas-soft:rgba(255,255,255,.14); --canvas-softer:rgba(255,255,255,.07); --canvas-muted:rgba(255,255,255,.75);
  --rail:#1A1D21; --rail-hi:#2A2F35; --rail-line:#2C3137;
  --card:#23272C; --row-line:#30353B; --row-hover:#2A2F35; --field:#1C1F23; --field-line:#3A4047;
  --ink:#E5E8EB; --muted:#9AA1A9; --faint:#666D75;
  --accent:#5C9BEA; --on-accent:#0D1726; --accent-soft:#1E3047;
  --star-off:#4A5058; --c-inbox:#9AA1A9; --c-ref:#9AA1A9;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:color-mix(in srgb, var(--canvas-base) 45%, #0B1422); --canvas-ink:#FFFFFF; --canvas-soft:rgba(255,255,255,.14); --canvas-softer:rgba(255,255,255,.07); --canvas-muted:rgba(255,255,255,.75);
  --rail:#1A1D21; --rail-hi:#2A2F35; --rail-line:#2C3137;
  --card:#23272C; --row-line:#30353B; --row-hover:#2A2F35; --field:#1C1F23; --field-line:#3A4047;
  --ink:#E5E8EB; --muted:#9AA1A9; --faint:#666D75;
  --accent:#5C9BEA; --on-accent:#0D1726; --accent-soft:#1E3047;
  --star-off:#4A5058; --c-inbox:#9AA1A9; --c-ref:#9AA1A9;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--canvas)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;-webkit-text-size-adjust:100%;direction:rtl;background:var(--canvas);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.4}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
svg{flex:none}

.app{display:grid;grid-template-columns:200px minmax(0,1fr);height:100%}

/* ---- rail ---- */
.rail{background:var(--rail);border-inline-end:1px solid var(--rail-line);display:flex;flex-direction:column;min-height:0;padding-right:env(safe-area-inset-right,0px)}
.brand{height:34px;display:flex;align-items:center;padding:0 12px;flex:none}
.brand{gap:8px}
.brandic{width:24px;height:24px;flex:none}
.brand b{font-weight:300;font-size:17px;letter-spacing:.42em;color:var(--accent)}
.navscroll{flex:1;min-height:0;overflow:auto;padding:4px 4px 10px}
nav ul{list-style:none;margin:0;padding:0}
nav ul+ul{margin-top:12px}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:start;padding:5px 9px;border-radius:3px;color:var(--ink);font-size:13.5px;min-height:26px}
.nav:hover{background:var(--rail-hi)}
.nav[aria-current="true"]{background:var(--rail-hi)}
.nav .ic{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--c-inbox)}
.nav .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.nav-focus .ic{color:var(--star)} .nav-next .ic{color:var(--c-next)} .nav-later .ic{color:var(--c-later)}
.nav-scheduled .ic{color:var(--c-sched)} .nav-someday .ic{color:var(--c-someday)} .nav-waiting .ic{color:var(--c-waiting)}
.nav-inbox.hot .ct{color:var(--accent);font-weight:700}
.navsec{display:flex;align-items:center;width:100%;margin-top:18px;padding:4px 9px;border-radius:3px;font-size:13.5px;color:var(--ink);text-align:start}
.navsec span:first-child{flex:1}
.navsec:hover,.navsec[aria-current="true"]{background:var(--rail-hi)}
.navsec .ct{font-size:12px;color:var(--muted)}
.nav.sub .ic{color:var(--faint)}
.pdot{width:7px;height:7px;border:1.3px solid currentColor;border-radius:50%}
.navfoot{border-top:1px solid var(--rail-line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));flex:none}
.nav-logbook .ic,.nav-trash .ic{color:var(--faint)}

/* ---- main / top bar ---- */
main{min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--canvas);color:var(--canvas-ink)}
.topbar{flex:none;display:flex;align-items:center;gap:4px;height:34px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:12px}
.tb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:3px;color:var(--canvas-ink);font-size:13px;font-weight:500;white-space:nowrap}
.tb:hover,.tb[aria-expanded="true"]{background:var(--canvas-softer)}
.tb.menu{display:none}
.tsearch{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:3px;min-width:0}
.tsearch:focus-within{background:var(--canvas-soft)}
.tsearch input{background:none;border:0;outline:0;color:var(--canvas-ink);font-size:13px;font-weight:500;width:110px;min-width:0}
.tsearch input::placeholder{color:var(--canvas-ink);opacity:1}
.tsearch input:focus{width:200px}
.tsearch input:focus::placeholder{opacity:.6}
.tfill{flex:1}
.tsel{background:transparent;border:0;color:var(--canvas-ink);font-size:13px;font-weight:500;height:28px;padding:0 4px;border-radius:3px;max-width:150px;cursor:pointer}
.tsel:hover{background:var(--canvas-softer)}
.tsel option{color:#24272B;background:#fff}
.sync .dot{width:6px;height:6px;border-radius:50%;background:var(--dot-ok)}
.sync .dot.warn{background:var(--dot-warn)}
.tmenu{position:relative}
.pop{position:absolute;top:32px;inset-inline-end:0;z-index:35;background:var(--card);color:var(--ink);border-radius:4px;box-shadow:var(--shadow);min-width:210px;padding:5px 0;display:grid}
.pop>button,.pop>label{display:block;text-align:start;padding:6px 14px;font-size:13.5px;cursor:pointer}
.pop>button:hover,.pop>label:hover{background:var(--row-hover)}
.pop hr{border:0;border-top:1px solid var(--row-line);margin:5px 0}
.popacct{padding:6px 14px;font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.popacct button{color:var(--accent);text-align:start;font-size:13.5px}
.keys{padding:6px 14px 4px;font-size:11.5px;color:var(--muted);line-height:1.8}
.keys kbd{font-family:inherit;border:1px solid var(--field-line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--field)}

.content{flex:1;min-height:0;overflow:auto;padding-block:22px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:24px}
.wrap{max-width:1180px}
.head{margin-bottom:4px}
.head h1{font-size:24px;font-weight:700;margin:0;line-height:1.2;text-wrap:balance}
.head .sub{color:var(--canvas-muted);font-size:12.5px;font-weight:500;margin-top:2px}
.status{color:var(--canvas-muted);padding:30px 0}

.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.chip{background:var(--canvas-softer);border-radius:3px;padding:3px 9px;font-size:12.5px;color:var(--canvas-ink);font-weight:500}
.chip:hover{background:var(--canvas-soft)}
.chip[aria-pressed="true"]{background:var(--card);color:var(--accent)}
.tools select{background:var(--canvas-softer);border:0;border-radius:3px;padding:3px 6px;font-size:12.5px;color:var(--canvas-ink);font-weight:500}
.tools select option{color:#24272B;background:#fff}
.clear{font-size:12.5px;color:var(--canvas-ink);text-decoration:underline}

.addbar{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border-radius:3px;padding:0 10px;height:36px;margin-bottom:4px}
.addbar .plus{color:var(--faint);display:grid;place-items:center}
.addbar input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px;height:100%}
.addbar input::placeholder{color:var(--faint)}
.addbar .btn{height:24px;padding:0 10px;font-size:12.5px}
.addhint{font-size:11.5px;color:var(--canvas-muted);margin:2px 2px 10px}
.addhint code{font-family:inherit;background:var(--canvas-softer);padding:0 4px;border-radius:3px}

.group{margin-top:16px}
.group:first-of-type{margin-top:0}
.ghead{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--canvas-ink);padding:0 1px 6px}
.ghead button{color:inherit;font-weight:700}
.ghead button:hover{text-decoration:underline}
.ghead .gm{font-weight:400;color:var(--canvas-muted);font-size:12px}

/* ---- task rows ---- */
ul.tasks{list-style:none;margin:0;padding:0}
.task{background:var(--card);color:var(--ink);border-bottom:1px solid var(--row-line)}
.task:first-child{border-top-left-radius:3px;border-top-right-radius:3px}
.task:last-child{border-bottom:0;border-bottom-left-radius:3px;border-bottom-right-radius:3px}
.task.open{margin-block:10px;border-radius:3px;border-bottom:0;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.task.open .trow{display:none}
.trow{display:flex;align-items:center;gap:7px;min-height:28px;padding:3px 8px 3px 6px}
.trow:hover{background:var(--row-hover)}
.task.dragover{box-shadow:inset 0 2px 0 var(--accent)}
.task.dragging{opacity:.4}
.grip{width:8px;height:14px;color:var(--faint);cursor:grab;display:grid;place-items:center;opacity:.8}
.check{width:15px;height:15px;border:1px solid #B9BEC4;border-radius:2px;background:var(--field);flex:none;display:grid;place-items:center;color:transparent}
.check:hover{border-color:var(--ok);color:var(--ok)}
.task.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.task.done .ttitle{color:var(--faint);text-decoration:line-through}
.star{width:20px;height:20px;display:grid;place-items:center;color:var(--star-off);flex:none;border-radius:3px}
.star:hover{color:var(--star)}
.star.on{color:var(--star)}
.star-sp{width:20px;flex:none}
.tmain{flex:1;min-width:0;cursor:pointer;display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;padding-block:2px}
.ttitle{overflow-wrap:anywhere;font-size:14px}
.meta{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;font-size:11.5px;color:var(--muted)}
.meta .tg{background:var(--rail-hi);color:var(--muted);border-radius:3px;padding:0 5px;line-height:17px}
.meta .late{color:var(--danger);font-weight:500}
.meta .soon{color:var(--c-waiting);font-weight:500}
.meta .en{letter-spacing:1px;font-size:9px}
.note-ic{color:var(--faint)}
.caret{width:16px;height:16px;border:1px solid var(--field-line);border-radius:2px;display:grid;place-items:center;color:var(--muted);flex:none}
.rowdel{width:24px;height:24px;display:grid;place-items:center;color:var(--faint);border-radius:3px;flex:none;opacity:.55}
.rowdel svg{width:14px;height:14px}
.trow:hover .rowdel{opacity:1}
.rowdel:hover,.rowdel:focus-visible{color:var(--danger);background:var(--row-hover);opacity:1}
@media (hover:none){.rowdel{opacity:.8}}
.caret:hover{border-color:var(--muted);color:var(--ink)}

/* ---- editor ---- */
.editor{padding:20px 18px 18px}
.egrid{display:grid;grid-template-columns:22px minmax(0,1fr) 180px;gap:10px 12px;align-items:start}
.estar{margin-top:5px}
.emain{display:grid;gap:8px;min-width:0}
.editor input[type=text],.editor textarea,.pdetails textarea{background:var(--field);border:1px solid var(--field-line);border-radius:3px;padding:6px 9px;width:100%;min-width:0;font-size:14px}
.editor input[type=text]:focus,.editor textarea:focus,.sctl:focus-within{border-color:var(--accent);outline:0}
.editor .etitle{height:32px}
.editor [data-f="tags"]{font-size:12.5px;height:28px}
.editor textarea{min-height:140px;resize:vertical}
.eside{display:grid;gap:6px;min-width:0}
.sgap{height:12px}
.sctl{display:flex;align-items:center;gap:6px;height:30px;border:1px solid var(--field-line);border-radius:3px;padding:0 6px;background:var(--field);min-width:0;color:var(--muted);font-size:12.5px}
.sctl .si{width:16px;display:grid;place-items:center;color:var(--faint)}
.sctl select,.sctl input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:12.5px;color:var(--ink);height:100%}
.sctl select.unset{color:var(--muted)}
.sctl .sl{flex:none}
.sctl .clr{flex:none;color:var(--muted);font-size:17px;line-height:1;width:22px;height:22px;border-radius:3px;display:grid;place-items:center}
.sctl .clr:hover{color:var(--danger);background:var(--row-hover)}
.sctl .rn{flex:0 0 44px;border-inline-start:1px solid var(--field-line);padding-inline-start:6px}
.toggle{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:var(--muted);line-height:1.35}
.tagsugg{display:flex;flex-wrap:wrap;gap:4px;margin-top:-2px}
.tagsugg:empty{display:none}
.tagsugg button{font-size:11.5px;color:var(--muted);padding:1px 6px;border-radius:3px;background:var(--rail-hi)}
.tagsugg button:hover{color:var(--accent)}
.eactions{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:4px}
.eactions .row{display:flex;gap:6px}
.btn{border:1px solid var(--field-line);background:var(--field);border-radius:3px;padding:5px 14px;font-weight:500;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:transparent;background:none}
.btn.danger:hover{text-decoration:underline}
.btn.sm{padding:2px 9px;font-size:12px}

/* ---- empty states ---- */
.empty{padding:26px 2px;color:var(--canvas-muted);max-width:56ch}
.empty h3{margin:0 0 4px;color:var(--canvas-ink);font-size:15px;font-weight:500}
.empty p{margin:0 0 12px}
.empty .btn{background:var(--card)}
.empty .linkbtn{color:var(--canvas-ink);text-decoration:underline}

/* ---- projects ---- */
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;min-height:34px;padding:5px 10px}
.prow:hover{background:var(--row-hover)}
.prow .pt{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.prow .pt b{font-weight:500}
.prow .pm{font-size:11.5px;color:var(--muted)}
.ring{width:16px;height:16px;flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .bgc{stroke:var(--row-line)}
.ring .fgc{stroke:var(--c-sched);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.projcard{background:var(--card);color:var(--ink);border-radius:3px;margin-bottom:20px}
.phrow{display:flex;align-items:center;gap:10px;padding:20px 16px 20px 14px}
.ptitle{flex:1;min-width:0;border:0;background:none;font-size:17px;font-weight:700;padding:3px 4px;border-radius:3px;color:var(--ink)}
.ptitle:hover{background:var(--row-hover)}
.ptitle:focus{outline:1px solid var(--field-line);background:var(--field)}
.pmeta{font-size:12px;color:var(--muted);white-space:nowrap}
.pdetails{border-top:1px solid var(--row-line);padding:14px 16px 16px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px}
.pdetails textarea{min-height:96px;resize:vertical}
.pfolds{background:var(--card);color:var(--ink);border-radius:3px;overflow:hidden}
.pf+.pf{border-top:1px solid var(--row-line)}
.pfold{display:flex;align-items:center;gap:8px;width:100%;text-align:start;min-height:36px;padding:6px 10px}
.pfold:hover{background:var(--row-hover)}
.pfold .chev{color:var(--muted);width:12px;font-size:12px;flex:none}
.pfold b{font-weight:600;flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfold .gm{font-size:11.5px;color:var(--muted);background:var(--rail-hi);border-radius:99px;padding:0 7px;flex:none}
.pfold .pnext{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfold .pgo{margin-inline-start:auto;color:var(--faint);display:grid;place-items:center;width:28px;height:28px;border-radius:3px;flex:none}
.pfold .pgo:hover{color:var(--accent);background:var(--rail-hi)}
.pf ul.tasks{border-top:1px solid var(--row-line)}
.pf ul.tasks .task{border-radius:0}
.pf ul.tasks .trow{padding-inline-start:24px}
.task.dl{outline:2px solid var(--danger);outline-offset:-2px;border-radius:3px;margin-bottom:3px;border-bottom:0}
.dlh{color:var(--canvas-ink);background:var(--danger);border-radius:3px;padding:1px 8px}
.schsec{color:var(--canvas-ink);font-size:15px;font-weight:700;margin:22px 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.schsec span{font-size:12px;font-weight:400;color:var(--canvas-muted)}
.recpanel{display:flex;align-items:center;gap:16px;background:var(--card);color:var(--ink);border-radius:3px;padding:16px;margin-bottom:16px}
.recbtn{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.recbtn:disabled{opacity:.4;cursor:not-allowed}
.recpanel.on .recbtn{background:var(--danger);color:#fff;animation:recpulse 1.4s ease-in-out infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 45%,transparent)}50%{box-shadow:0 0 0 12px transparent}}
.reclive{flex:1;min-width:0;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.reclive .ph{color:var(--muted);font-size:13.5px}
.nic{color:var(--accent);display:grid}
.nentries{list-style:none;margin:0;padding:0}
.nentries li{background:var(--card);color:var(--ink);padding:10px 14px;border-bottom:1px solid var(--row-line)}
.nentries li:first-child{border-radius:3px 3px 0 0}
.nentries li:last-child{border-radius:0 0 3px 3px;border-bottom:0}
.nentries li:only-child{border-radius:3px}
.nentries .nt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.55}
.nentries .nm{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:11.5px;color:var(--muted)}

const $ = s => document.querySelector(s);

const pad = n => String(n).padStart(2, '0');

let dayShift = 0; /* לחישוב הפוקוס של הימים הבאים עבור הווידג'ט */
const today = () => { const d = new Date(); if (dayShift) d.setDate(d.getDate() + dayShift); return ymd(d); };
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
function addInterval(s, unit, n){
  const d = parseD(s);
  if (unit === 'day') d.setDate(d.getDate() + n);
  else if (unit === 'week') d.setDate(d.getDate() + 7 * n);
  else if (unit === 'month'){ const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
  else if (unit === 'year') d.setFullYear(d.getFullYear() + n);
  return ymd(d);
}
const MONTHS = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
function fmtDate(s){
  if (!s) return '';
  const t = today(); if (s === t) return 'היום';
  if (s === addDays(t, 1)) return 'מחר'; if (s === addDays(t, -1)) return 'אתמול';
  const d = parseD(s); const now = new Date();
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() : '');
}
function fmtDue(s){
  const d = parseD(s);
  if (P().dueStyle === 'date'){ const now = new Date(); return d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() : ''); }
  const n = Math.round((d - parseD(today())) / 864e5);
  if (n === 0) return 'היום'; if (n === 1) return 'מחר'; if (n === 2) return 'בעוד יומיים'; if (n === -1) return 'אתמול'; if (n === -2) return 'שלשום';
  return n > 0 ? 'בעוד ' + n + ' ימים' : 'לפני ' + (-n) + ' ימים';
}

/* ---------- backends ---------- */
function makeQueue(){
  const pending = {}, running = {};
  async function run(key){
    running[key] = true;
    while (pending[key]){ const f = pending[key]; pending[key] = null;
      try { await f(); } catch (e){ onStoreError(e); } }
    running[key] = false;
  }
  return (key, fn) => { pending[key] = fn; if (!running[key]) run(key); };
}
function onStoreError(e){
  const code = e && e.code;
  console.error(e);
  if (code === 'permission-denied') toast('אין הרשאה לשמור. בדוק את כללי האבטחה של Firestore.');
  else if (code === 'resource-exhausted') toast('הגעת למכסה היומית החינמית של Firebase. נסה שוב מחר.');
  else toast('השמירה נכשלה. נסה שוב בעוד רגע.');
}
let unsubs = [];
function fsBackend(fs, uid){
  const root = fs.collection('users').doc(uid);
  const col = root.collection('items');
  const setRef = root.collection('meta').doc('settings');
  unsubs.push(col.onSnapshot({includeMetadataChanges:true}, snap => {
    const m = new Map(); snap.forEach(d => m.set(d.id, Object.assign({}, d.data(), {id:d.id})));
    S.items = m; S.loaded = true; S.pending = snap.metadata.hasPendingWrites; S.fromCache = snap.metadata.fromCache; render(); renderMode();
  }, err => { console.error(err); toast('אין גישה לנתונים. בדוק את כללי האבטחה של Firestore.'); }));
  unsubs.push(setRef.onSnapshot(s => { if (s.exists) S.settings = Object.assign({areas:[]}, s.data()); render(); }, () => {}));
  const widRef = root.collection('meta').doc('widget');
  S.widgetRemote = null;
  unsubs.push(widRef.onSnapshot(s => { S.widgetRemote = s.exists ? (s.data().json || '') : ''; syncWidget(); }, () => {}));
  const w = p => p.catch(onStoreError);
  return {
    put(item){ const body = clean(item); delete body.id; w(col.doc(item.id).set(body)); },
    remove(id){ w(col.doc(id).delete()); },
    saveSettings(){ w(setRef.set(clean(S.settings))); },
    saveWidget(json){ S.widgetRemote = json; widRef.set({ json, at: Date.now() }).catch(() => {}); }
  };
}
function localBackend(){
  const KEY = 'tzalul.v1';
  try { const raw = localStorage.getItem(KEY); if (raw){ const d = JSON.parse(raw);
    for (const it of d.items || []) S.items.set(it.id, it); S.settings = Object.assign({areas:[]}, d.settings); } } catch (e) {}
  S.loaded = true;
  let t = null;
  const save = () => { clearTimeout(t); t = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify({items:all(), settings:S.settings})); } catch (e) {} }, 150); };
  return { put(){ save(); }, remove(){ save(); }, saveSettings(){ save(); } };
}

function groupHtml(title, tasks, ctx){

function renderMain(){

/* swipe gestures on phones: sideways moves to the neighbouring list in the bottom bar's order */
let sw = null;
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1){ sw = null; return; }
  const t = e.touches[0]; sw = {x:t.clientX, y:t.clientY, at:Date.now(), skip:!!e.target.closest('input,textarea,select,.editor,.modal,.tabbar')};
}, {passive:true});
document.addEventListener('touchcancel', () => { sw = null; }, {passive:true});
document.addEventListener('touchend', e => {
  const st = sw; sw = null;
  if (!st || st.skip || !matchMedia('(max-width:760px)').matches) return;
  const t = e.changedTouches[0]; const dx = t.clientX - st.x, dy = t.clientY - st.y;
  if (Date.now() - st.at > 800 || Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
  if ($('#modalHost').innerHTML || S.openId) return;
  const order = S.tabOrder || []; const v = S.view === 'project' ? 'projects' : S.view === 'ref' ? 'reference' : S.view === 'note' ? 'notes' : S.view;
  const i = order.indexOf(v) + (dx > 0 ? 1 : -1);
  if (order.indexOf(v) < 0 || i < 0 || i >= order.length) return;
  go(order[i]);
}, {passive:true});

/* drag & drop: reorder within a list, or drop onto a list / project in the rail */
let dragId = null;
document.addEventListener('dragstart', e => { const li = e.target.closest && e.target.closest('.task[draggable="true"]'); if (!li) return;
  dragId = li.dataset.id; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (er) {} });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging,.dragover,.drop').forEach(x => x.classList.remove('dragging', 'dragover', 'drop')); });
document.addEventListener('dragover', e => {
  if (!dragId) return;
  const tgt = e.target.closest('[data-drop],.task'); document.querySelectorAll('.dragover,.drop').forEach(x => x.classList.remove('dragover', 'drop'));
  if (!tgt) return; e.preventDefault();
  if (tgt.classList.contains('task')){ if (tgt.dataset.id !== dragId) tgt.classList.add('dragover'); } else tgt.classList.add('drop');
});
document.addEventListener('drop', e => {
  if (!dragId) return; const tgt = e.target.closest('[data-drop],.task'); if (!tgt) return; e.preventDefault();
  const it = get(dragId); if (!it) return;
  if (tgt.dataset.drop){
    const d = tgt.dataset.drop;
    if (d.startsWith('project:')){ patch(it.id, {parent:d.slice(8), list:it.list === 'inbox' || it.list === 'trash' ? 'next' : it.list}); toast('הועבר לפרויקט'); }
    else if (d === 'focus') patch(it.id, {focus:true});
    else if (d === 'trash') trash(it.id);
    else if (d === 'scheduled') patch(it.id, {list:'scheduled', focus:false, start:it.start && it.start > today() ? it.start : addDays(today(), 1)});
    else if (TASK_STATES.some(s => s[0] === d)){ const chg = {list:d}; if (it.list === 'inbox' && P().inboxArea && S.area !== 'all' && !it.area) chg.area = S.area; patch(it.id, chg); toast('הועבר ל' + LISTS[d].label); }
  } else if (tgt.dataset.id && tgt.dataset.id !== dragId){
    const ul = tgt.closest('ul.tasks'); const ids = [...ul.querySelectorAll(':scope > .task')].map(x => x.dataset.id).filter(x => x !== dragId);
    ids.splice(ids.indexOf(tgt.dataset.id), 0, dragId);
    const orders = ids.map(x => get(x)?.order || 0).sort((a, b) => a - b);
    ids.forEach((x, i) => { const o = get(x); if (o && o.order !== orders[i]) put(Object.assign({}, o, {order:orders[i] === orders[i - 1] ? orders[i] + i * 0.001 : orders[i]})); });
  }
});

  const a = document.createElement('a'); a.href = url; a.download = 'tzalul-backup-' + today() + '.json';

  r.onload = async () => {
    try { const d = JSON.parse(r.result); if (!Array.isArray(d.items)) throw 0;
      if (d.settings && Array.isArray(d.settings.areas)){ const have = new Set((S.settings.areas || []).map(a => a.id));
        S.settings.areas = [...(S.settings.areas || []), ...d.settings.areas.filter(a => !have.has(a.id))]; backend.saveSettings(); }

      let n = 0; for (const it of d.items){ if (it && it.id && typeof it.id === 'string' && /^[\w.~:@+-]+$/.test(it.id)){ put(it); n++; if (n % 20 === 0) await new Promise(res => setTimeout(res, 120)); } }

    } catch (er){ toast('הקובץ לא נראה כמו גיבוי של צלול.'); }
    e.target.value = '';
  };
  r.readAsText(f);
};

/* restore last view, then boot */
try { const lv = JSON.parse(localStorage.getItem('tzalul.view') || 'null'); if (lv && (LISTS[lv.v] || lv.v === 'project' || lv.v === 'ref')){ S.view = lv.v; if (lv.v === 'project') S.projectId = lv.id; if (lv.v === 'ref') S.refId = lv.id; }
  const la = localStorage.getItem('tzalul.area'); if (la) S.area = la; } catch (e) {}
document.documentElement.setAttribute('dir', 'rtl'); document.documentElement.setAttribute('lang', 'he');
render();
initBackend();
setInterval(() => { const d = today(); if (d !== window.__d){ window.__d = d; render(); } }, 60000); window.__d = today();
if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
